# Refreshes the skills.sh install counts shown on the skill cards (catalog/installs.json) once a day and commits
# the change, which redeploys the site.
name: Refresh install counts

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/installs.mjs
      - run: npm ci && npm run build
      - name: Commit the new counts
        run: |
          git diff --quiet -- catalog/installs.json public/catalog.json && exit 0
          git config user.name "toolup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog/installs.json public/catalog.json
          git commit -m "Refresh skills.sh install counts"
          git push
